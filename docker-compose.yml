services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://somnath-ji.vercel.app,http://localhost:5173,http://localhost:4173}
      - FILE_TTL_SECONDS=${FILE_TTL_SECONDS:-3600}
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://youtube-downloader-yt35.onrender.com}
        VITE_WS_URL: ${VITE_WS_URL:-wss://youtube-downloader-yt35.onrender.com/api/ws/download}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads:
