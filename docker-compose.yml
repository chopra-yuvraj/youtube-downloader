services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      - FILE_TTL_SECONDS=3600
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/api/ws/download
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads:
